<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #050101; }
      .border { fill: none; stroke: #1a0505; stroke-width: 2; }
      .title { font-family: 'JetBrains Mono', monospace; font-size: 16px; fill: #FF1414; font-weight: 700; }
      .stat-num { font-family: 'JetBrains Mono', monospace; font-size: 30px; fill: #FF1414; font-weight: 700; }
      .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #C9A0A0; font-weight: 700; }
      .divider { stroke: #3a1414; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="900" height="160" rx="8"/>
  <rect class="border" x="1" y="1" width="898" height="158" rx="8"/>

  <text x="30" y="38" class="title">$ ./milestones.sh --static</text>
  <line class="divider" x1="30" y1="52" x2="870" y2="52"/>

  <text x="130" y="100" class="stat-num" text-anchor="middle">7</text>
  <text x="130" y="123" class="stat-label" text-anchor="middle">PROJECTS SHIPPED</text>

  <line class="divider" x1="260" y1="65" x2="260" y2="135"/>

  <text x="390" y="100" class="stat-num" text-anchor="middle">18</text>
  <text x="390" y="123" class="stat-label" text-anchor="middle">PUBLIC REPOS</text>

  <line class="divider" x1="520" y1="65" x2="520" y2="135"/>

  <text x="650" y="100" class="stat-num" text-anchor="middle">4</text>
  <text x="650" y="123" class="stat-label" text-anchor="middle">FOLLOWERS</text>

  <line class="divider" x1="780" y1="65" x2="780" y2="135"/>

  <text x="850" y="95" class="stat-label" text-anchor="middle">MEMBER</text>
  <text x="850" y="112" class="stat-num" text-anchor="middle" style="font-size:22px;">2024</text>
</svg>
