nsolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >Labs starting - HTB / CTF track next</text><text x="20" y="133.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#6f8f85" font-weight="normal" text-anchor="start" letter-spacing="0" >Tools:</text><text x="88" y="133.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >Nmap, Metasploit, Burp Suite, Wireshark</text><text x="20" y="149.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#6f8f85" font-weight="normal" text-anchor="start" letter-spacing="0" >Focus:</text><text x="88" y="149.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >Reverse Engineering</text><text x="20" y="180.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#38bdf8" font-weight="bold" text-anchor="start" letter-spacing="0" >$ cat ./mindset.log</text><text x="20" y="195.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >&gt; Every CS discipline becomes part of the mindset: frontend,</text><text x="32.64" y="211.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >backend, UI/UX, SOC analyst, now security-first + reverse</text><text x="32.64" y="226.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >engineering. Still expanding, no ceiling</text><text x="20" y="242.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >&gt; Reason from mechanism before symptom: trace every anomaly</text><text x="32.64" y="257.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >back to origin before accepting the surface explanation</text><text x="20" y="273.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >&gt; Lab hours start now. Pattern recognition compounds from</text><text x="32.64" y="288.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >here</text><text x="20" y="319.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#38bdf8" font-weight="bold" text-anchor="start" letter-spacing="0" >$ ls ./projects --featured</text><text x="20" y="335.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#38bdf8" font-weight="bold" text-anchor="start" letter-spacing="0" >[ COMING SOON ]</text><text x="20" y="350.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >Security builds ship once lab hours back the theory.</text><text x="20" y="366.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >Nothing public yet. By design.</text><text x="20" y="397.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#6f8f85" font-weight="normal" text-anchor="start" letter-spacing="0" >Next:</text><text x="88" y="397.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >HTB Starting Point track</text><text x="20" y="412.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >&gt; Building the reasoning muscle before tool fluency.</text><text x="32.64" y="428.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >Fundamentals first, always</text><text x="20" y="459.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#38bdf8" font-weight="bold" text-anchor="start" letter-spacing="0" >ayanokouji@kalios ~&gt;</text><rect x="150" y="449.0" width="6" height="12" fill="#38bdf8"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
