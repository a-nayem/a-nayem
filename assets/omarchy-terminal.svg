',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >Locate -&gt; Reason -&gt; Build -&gt; Deploy</text><text x="20" y="133.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#6f8f85" font-weight="normal" text-anchor="start" letter-spacing="0" >Stack:</text><text x="88" y="133.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >Python, TypeScript, Next.js, FastAPI</text><text x="20" y="149.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#6f8f85" font-weight="normal" text-anchor="start" letter-spacing="0" >Tools:</text><text x="88" y="149.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >Docker, n8n, Supabase, neovim</text><text x="20" y="180.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#22e58b" font-weight="bold" text-anchor="start" letter-spacing="0" >$ cat ./mindset.log</text><text x="20" y="195.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >&gt; Diagnose from mechanism, not symptom: reason through</text><text x="32.64" y="211.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >failure modes before reading a log</text><text x="20" y="226.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >&gt; GTM Engineering: wire n8n + Clay + HubSpot into a</text><text x="32.64" y="242.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >business's first foothold in its market</text><text x="20" y="257.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >&gt; Not "AI engineer." Not "ML engineer." One system running</text><text x="32.64" y="273.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >FDE + GTM + full-stack ops + hardware control as a single</text><text x="32.64" y="288.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >identity</text><text x="20" y="304.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >&gt; ELUSIVE: teaching a local system to reason and build the</text><text x="32.64" y="319.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#b9d6cc" font-weight="normal" text-anchor="start" letter-spacing="0" >way I do. Autonomous, missing only emotion</text><text x="20" y="350.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#22e58b" font-weight="bold" text-anchor="start" letter-spacing="0" >$ ls ./projects --featured</text><text x="20" y="366.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#22e58b" font-weight="bold" text-anchor="start" letter-spacing="0" >Trisien OS</text><text x="112" y="366.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#6f8f85" font-weight="normal" text-anchor="start" letter-spacing="0" >multi-agent orchestration, 6 LLM providers</text><text x="20" y="381.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#22e58b" font-weight="bold" text-anchor="start" letter-spacing="0" >Trisien Vault</text><text x="112" y="381.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#6f8f85" font-weight="normal" text-anchor="start" letter-spacing="0" >self-hosted second brain, 342-node graph</text><text x="20" y="397.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#22e58b" font-weight="bold" text-anchor="start" letter-spacing="0" >Trisien CRM</text><text x="112" y="397.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#6f8f85" font-weight="normal" text-anchor="start" letter-spacing="0" >self-hosted agentic CRM, AI lead scoring</text><text x="20" y="412.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#22e58b" font-weight="bold" text-anchor="start" letter-spacing="0" >ELUSIVE</text><text x="112" y="412.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#6f8f85" font-weight="normal" text-anchor="start" letter-spacing="0" >local-first autonomous system (private)</text><text x="20" y="428.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#22e58b" font-weight="bold" text-anchor="start" letter-spacing="0" >Quizzen</text><text x="112" y="428.0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#6f8f85" font-weight="normal" text-anchor="start" letter-spacing="0" >offline Android quiz app</text><text x="20" y="443.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#22e58b" font-weight="bold" text-anchor="start" letter-spacing="0" >Oblivion</text><text x="112" y="443.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#6f8f85" font-weight="normal" text-anchor="start" letter-spacing="0" >self-built Obsidian clone</text><text x="20" y="474.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#22e58b" font-weight="bold" text-anchor="start" letter-spacing="0" >omen39@omarchy ~&gt;</text><rect x="131" y="464.5" width="6" height="12" fill="#22e58b"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
