name: generate-snake

on:
  schedule:
    - cron: "0 */6 * * *"   # regenerate every 6h so the animation stays current
  workflow_dispatch:         # lets you trigger it manually the first time
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: a-nayem
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#0b1411,#0e4429,#1f9e73,#22e58b,#7dffc4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
