name: generate-snake

on:
  schedule:
    - cron: "0 */6 * * *"   # regenerate every 6h so the animation stays current
  workflow_dispatch:         # lets you trigger it manually the first time
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: a-nayem
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FF0000&color_dots=#1a0505,#4d0f0f,#8c1c1c,#c22a2a,#FF3333
            dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
